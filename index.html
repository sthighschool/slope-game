<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Slope Game — Gamepad Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; }
    #game { width: 800px; height: 400px; background: #111; color: #fff; position: relative; overflow: hidden; }
    #player { width: 40px; height: 40px; background: #0f0; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); }
    #info { margin-top: 10px; }
    button { padding: 8px 12px; }
  </style>
</head>
<body>
  <h1>Slope Game — Gamepad Demo</h1>
  <div id="game">
    <div id="player"></div>
  </div>
  <div id="info">
    <button id="startBtn">Start Game</button>
    <span id="status">No gamepad</span>
  </div>

  <script src="gamepad.js" defer></script>
</body>
</html>
