<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Slope Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gameContainer {
      width: 100vw;
      height: 100vh;
      background: #111;
    }

    #status {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 50;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="status">Loading Slope Game...</div>
  <div id="gameContainer"></div>

  <script src="js/UnityProgress.js"></script>
  <script src="js/unityloader41.js"></script>

  <script>
    // Simple Gamepad adapter for Unity WebGL:
    // maps a connected controller into keyboard-style input
    // so the game can react as if arrow keys/space are pressed.
    (function () {
      const statusEl = document.getElementById('status');
      let gamepadConnected = false;
      let lastButtons = {};

      function deadzone(v, dz = 0.18) {
        if (Math.abs(v) < dz) return 0;
        return (Math.abs(v) - dz) / (1 - dz) * Math.sign(v);
      }

      function dispatchKey(code, down) {
        const evt = new KeyboardEvent(down ? 'keydown' : 'keyup', {
          key: code,
          code: code,
          bubbles: true
        });
        document.dispatchEvent(evt);
      }

      function updateGamepad() {
        const pads = navigator.getGamepads ? navigator.getGamepads() : [];
        let gp = null;

        for (let i = 0; i < pads.length; i++) {
          if (pads[i]) { gp = pads[i]; break; }
        }

        if (!gp) return;

        const leftX = deadzone(gp.axes[0] || 0);
        const leftY = deadzone(gp.axes[1] || 0);

        // Left stick: left/right
        if (leftX < -0.25) {
          dispatchKey('ArrowLeft', true);
          dispatchKey('ArrowRight', false);
        } else if (leftX > 0.25) {
          dispatchKey('ArrowRight', true);
          dispatchKey('ArrowLeft', false);
        } else {
          dispatchKey('ArrowLeft', false);
          dispatchKey('ArrowRight', false);
        }

        // Left stick Y / buttons can act like jump/up if game uses it
        if (leftY < -0.25) {
          dispatchKey('ArrowUp', true);
        } else {
          dispatchKey('ArrowUp', false);
        }

        // A / B / X / Y are common button mappings
        const buttonMap = {
          0: 'KeyX',   // A
          1: 'KeyC',   // B
          2: 'KeyZ',   // X
          3: 'KeyV',   // Y
          4: 'Space',  // left trigger
          5: 'Space',  // right trigger
          9: 'Space'   // start button
        };

        for (let i = 0; i < gp.buttons.length; i++) {
          const pressed = !!gp.buttons[i].pressed;
          const mapped = buttonMap[i];
          if (!mapped) continue;

          if (pressed && !lastButtons[i]) {
            dispatchKey(mapped, true);
          } else if (!pressed && lastButtons[i]) {
            dispatchKey(mapped, false);
          }
        }

        lastButtons = {};
        for (let i = 0; i < gp.buttons.length; i++) {
          lastButtons[i] = !!gp.buttons[i].pressed;
        }
      }

      window.addEventListener('gamepadconnected', function (e) {
        gamepadConnected = true;
        statusEl.textContent = 'Gamepad connected: ' + e.gamepad.id;
      });

      window.addEventListener('gamepaddisconnected', function () {
        gamepadConnected = false;
        statusEl.textContent = 'No gamepad connected';
      });

      function tick() {
        updateGamepad();
        requestAnimationFrame(tick);
      }

      // Start polling once the game is ready
      requestAnimationFrame(tick);
    })();

    // Unity WebGL loader for Slope Game
    var gameInstance = UnityLoader.instantiate(
      "gameContainer",
      "data/slope.json",
      {
        onProgress: UnityProgress
      }
    );
  </script>
</body>
</html>
