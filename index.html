<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slope Game</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="js/UnityProgress.js"></script>
  <script src="js/unityloader41.js"></script>
  <script>
    var gameInstance = UnityLoader.instantiate("gameContainer", "/data/slope.json", { onProgress: UnityProgress, Module: { onRuntimeInitialized: function() { UnityProgress(gameInstance, "complete") } } });
  </script>
</head>
<body style="margin: 0; overflow: hidden;">
  <div class="webgl-content">
    <div id="gameContainer" style="width: 100%; height: 100%; margin: 0;"></div>
  </div>
  <div id="driver-status" style="position: absolute; bottom: 15px; left: 15px; color: #00ff00; background: rgba(0,0,0,0.85); padding: 8px 15px; border-radius: 5px; font-size: 13px; font-weight: bold; pointer-events: none; z-index: 99999; border: 1px solid #333;">🔌 CONNECT CONTROLLER & PRESS ANY BUTTON</div>
<script>
    const statusBox = document.getElementById('driver-status');
    let activeGamepadIndex = null;
    let leftActive = false;
    let rightActive = false;

    window.addEventListener("gamepadconnected", (event) => {
        activeGamepadIndex = event.gamepad.index;
        statusBox.innerText = "🎮 NATIVE DRIVER ACTIVE! Use Stick or D-Pad.";
        statusBox.style.borderColor = "#00ff00";
        statusBox.style.color = "#00ff00";
    });

    window.addEventListener("paddisconnected", () => {
        activeGamepadIndex = null;
        statusBox.innerText = "🔌 CONTROLLER DISCONNECTED";
        statusBox.style.borderColor = "#ff0000";
        statusBox.style.color = "#ff0000";
    });

    function fireKey(eventType, keyCode, keyString) {
        const keyEvent = new KeyboardEvent(eventType, {
            bubbles: true, cancelable: true, keyCode: keyCode, key: keyString, which: keyCode
        });
        window.dispatchEvent(keyEvent);
        document.dispatchEvent(keyEvent);
        const canvas = document.querySelector('canvas');
        if (canvas) canvas.dispatchEvent(keyEvent);
    }

    function hardwareTick() {
        if (activeGamepadIndex !== null) {
            const gamepad = navigator.getGamepads()[activeGamepadIndex];
            if (gamepad) {
                let stickX = gamepad.axes[0]; 
                let dPadLeft = gamepad.buttons[14]?.pressed || false;  
                let dPadRight = gamepad.buttons[15]?.pressed || false; 

                let wantLeft = stickX < -0.3 || dPadLeft;
                let wantRight = stickX > 0.3 || dPadRight;

                if (wantLeft && !leftActive) {
                    fireKey('keydown', 37, 'ArrowLeft'); fireKey('keydown', 65, 'a');
                    leftActive = true;
                } else if (!wantLeft && leftActive) {
                    fireKey('keyup', 37, 'ArrowLeft'); fireKey('keyup', 65, 'a');
                    leftActive = false;
                }

                if (wantRight && !rightActive) {
                    fireKey('keydown', 39, 'ArrowRight'); fireKey('keydown', 68, 'd');
                    rightActive = true;
                } else if (!wantRight && rightActive) {
                    fireKey('keyup', 39, 'ArrowRight'); fireKey('keyup', 68, 'd');
                    rightActive = false;
                }
            }
        }
        requestAnimationFrame(hardwareTick);
    }
    hardwareTick();
</script>

</body>
</html>
