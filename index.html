<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Assignment Helper</title>
    <!-- Relative path: Forces the page to load CSS straight from YOUR fork folders -->
    <link rel="stylesheet" href="./css/style.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #driver-status {
            position: absolute;
            bottom: 15px;
            left: 15px;
            color: #00ff00;
            background: rgba(0, 0, 0, 0.9);
            padding: 8px 15px;
            border-radius: 5px;
            font-family: sans-serif;
            font-size: 13px;
            font-weight: bold;
            pointer-events: none;
            z-index: 999999;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <div id="driver-status">🔌 CONNECT CONTROLLER & PRESS ANY BUTTON</div>

    <!-- Core Game Interface Target Containers -->
    <div id="game-container"></div>

    <!-- Relative path: Forces the page to load game logic straight from YOUR fork folders -->
    <script src="./js/game.js"></script>

    <script>
        const statusBox = document.getElementById('driver-status');
        let activeGamepadIndex = null;
        let leftPressed = false;
        let rightPressed = false;

        window.focus();

        window.addEventListener("gamepadconnected", (event) => {
            activeGamepadIndex = event.gamepad.index;
            statusBox.innerText = "🎮 LOCAL FORK ACTIVE! Use Stick or D-Pad.";
            statusBox.style.borderColor = "#00ff00";
            statusBox.style.color = "#00ff00";
        });

        window.addEventListener("gamepaddisconnected", () => {
            activeGamepadIndex = null;
            statusBox.innerText = "🔌 CONTROLLER DISCONNECTED";
            statusBox.style.borderColor = "#ff3333";
            statusBox.style.color = "#ff3333";
        });

        // System Keystroke Simulation Framework targeting document runtime
        function simulateKeyEvent(type, keyCode, keyString) {
            const targetElement = document.body;
            const eventPayload = new KeyboardEvent(type, {
                bubbles: true,
                cancelable: true,
                keyCode: keyCode,
                key: keyString,
                which: keyCode
            });
            window.dispatchEvent(eventPayload);
            document.dispatchEvent(eventPayload);
            targetElement.dispatchEvent(eventPayload);
        }

        // 60Hz Hardware Polling loop
        function executionLoop() {
            if (activeGamepadIndex !== null) {
                const gamepad = navigator.getGamepads()[activeGamepadIndex];
                if (gamepad) {
                    let axisX = gamepad.axes[0]; // Axis 0 = Left Joystick Left/Right horizontal plane
                    let dPadLeft = gamepad.buttons[14]?.pressed || false;  // Standard D-pad Left tracking mapping
                    let dPadRight = gamepad.buttons[15]?.pressed || false; // Standard D-pad Right tracking mapping

                    let wantLeft = axisX < -0.3 || dPadLeft;
                    let wantRight = axisX > 0.3 || dPadRight;

                    // Handle Left Inputs
                    if (wantLeft && !leftPressed) {
                        simulateKeyEvent('keydown', 37, 'ArrowLeft');
                        simulateKeyEvent('keydown', 65, 'a');
                        leftPressed = true;
                    } else if (!wantLeft && leftPressed) {
                        simulateKeyEvent('keyup', 37, 'ArrowLeft');
                        simulateKeyEvent('keyup', 65, 'a');
                        leftPressed = false;
                    }

                    // Handle Right Inputs
                    if (wantRight && !rightPressed) {
                        simulateKeyEvent('keydown', 39, 'ArrowRight');
                        simulateKeyEvent('keydown', 68, 'd');
                        rightPressed = true;
                    } else if (!wantRight && rightPressed) {
                        simulateKeyEvent('keyup', 39, 'ArrowRight');
                        simulateKeyEvent('keyup', 68, 'd');
                        rightPressed = false;
                    }
                }
            }
            requestAnimationFrame(executionLoop);
        }
        
        executionLoop();
    </script>
</body>
</html>
