<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Math Homework Simulator</title>
    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
      #gameContainer { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
      #driver-status { position: absolute; bottom: 15px; left: 15px; color: #00ff00; background: rgba(0,0,0,0.85); padding: 8px 15px; border-radius: 5px; font-size: 13px; font-weight: bold; pointer-events: none; z-index: 99999; border: 1px solid #333; }
    </style>
    <!-- Pulls configuration assets locally from YOUR repository folders -->
    <script src="TemplateData/UnityProgress.js"></script>  
    <script src="Build/UnityLoader.js"></script>
    <script>
      // Tells the engine to load the file assets straight from your repository
      var gameInstance = UnityLoader.instantiate("gameContainer", "Build/slope.json", {onProgress: UnityProgress});
    </script>
  </head>
  <body>
    
    <div id="driver-status">🔌 CONNECT CONTROLLER & PRESS ANY BUTTON</div>
    <div id="gameContainer"></div>

    <script>
        const statusBox = document.getElementById('driver-status');
        let activeGamepadIndex = null;
        let leftActive = false;
        let rightActive = false;

        window.focus();

        window.addEventListener("gamepadconnected", (event) => {
            activeGamepadIndex = event.gamepad.index;
            statusBox.innerText = "🎮 LOCAL DRIVER LIVE! Steer with Stick / D-Pad.";
            statusBox.style.borderColor = "#00ff00";
            statusBox.style.color = "#00ff00";
        });

        window.addEventListener("gamepaddisconnected", () => {
            activeGamepadIndex = null;
            statusBox.innerText = "🔌 CONTROLLER DISCONNECTED";
            statusBox.style.borderColor = "#ff0000";
            statusBox.style.color = "#ff0000";
        });

        // Key simulation injection engine targeting global document loops
        function fireKey(eventType, keyCode, keyString) {
            const targetElement = document.getElementById('gameContainer') || document.body;
            
            const keyEvent = new KeyboardEvent(eventType, {
                bubbles: true, cancelable: true, keyCode: keyCode, key: keyString, which: keyCode
            });
            
            window.dispatchEvent(keyEvent);
            document.dispatchEvent(keyEvent);
            targetElement.dispatchEvent(keyEvent);
            
            const canvas = document.querySelector('canvas');
            if (canvas) canvas.dispatchEvent(keyEvent);
        }

        // Hardware Polling tick (60Hz loop)
        function hardwareTick() {
            if (activeGamepadIndex !== null) {
                const gamepad = navigator.getGamepads()[activeGamepadIndex];
                if (gamepad) {
                    let stickX = gamepad.axes[0]; // Axis 0 = Horizontal Left Analog Stick
                    let dPadLeft = gamepad.buttons[14]?.pressed || false;  // D-pad Left standard map
                    let dPadRight = gamepad.buttons[15]?.pressed || false; // D-pad Right standard map

                    let wantLeft = stickX < -0.3 || dPadLeft;
                    let wantRight = stickX > 0.3 || dPadRight;

                    if (wantLeft && !leftActive) {
                        fireKey('keydown', 37, 'ArrowLeft'); fireKey('keydown', 65, 'a');
                        leftActive = true;
                    } else if (!wantLeft && leftActive) {
                        fireKey('keyup', 37, 'ArrowLeft'); fireKey('keyup', 65, 'a');
                        leftActive = false;
                    }

                    if (wantRight && !rightActive) {
                        fireKey('keydown', 39, 'ArrowRight'); fireKey('keydown', 68, 'd');
                        rightActive = true;
                    } else if (!wantRight && rightActive) {
                        fireKey('keyup', 39, 'ArrowRight'); fireKey('keyup', 68, 'd');
                        rightActive = false;
                    }
                }
            }
            requestAnimationFrame(hardwareTick);
        }
        
        hardwareTick();
    </script>
  </body>
</html>
